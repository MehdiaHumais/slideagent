<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SlideWiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="background-globes">
        <div class="globe globe-purple"></div>
        <div class="globe globe-cyan"></div>
    </div>

    <main class="glass-container" style="max-width: 480px;">
        <div class="logo">
            <i class="ph ph-key"></i>
            <h1><span class="logo-white">Reset</span><span class="logo-red">Password</span></h1>
        </div>
        <p class="auth-subtitle">Choose a new password for your account.</p>

        <div id="reset-form-wrap">
            <form id="reset-password-form">
                <div class="input-group">
                    <label for="reset-password">New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="reset-password" placeholder="Min 6 characters" required minlength="6" />
                        <button type="button" class="password-toggle" aria-label="Show password" tabindex="-1">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="input-group">
                    <label for="reset-password-confirm">Confirm New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="reset-password-confirm" placeholder="Re-enter password" required minlength="6" />
                        <button type="button" class="password-toggle" aria-label="Show password" tabindex="-1">
                            <i class="ph ph-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="reset-submit-btn" class="glow-on-hover" style="margin-top: 20px;">
                    <span class="btn-text">Reset Password</span>
                    <i class="ph-bold ph-check"></i>
                </button>
            </form>
        </div>

        <div id="reset-success-wrap" class="hidden" style="text-align: center; padding: 20px 0;">
            <div class="success-icon">
                <i class="ph-fill ph-check-circle"></i>
            </div>
            <h3>Password Updated!</h3>
            <p style="margin: 12px 0 20px; color: var(--text-muted);">Your password has been reset. You can now login with your new password.</p>
            <a href="/" class="glow-btn">
                <i class="ph-bold ph-sign-in"></i>
                Go to Login
            </a>
        </div>
    </main>

    <script>
        const token = {{ token|tojson }};
        const form = document.getElementById("reset-password-form");

        // Password visibility toggles (eye icon)
        document.addEventListener("click", (e) => {
            const toggle = e.target.closest(".password-toggle");
            if (!toggle) return;
            const input = toggle.parentElement.querySelector("input[type='password'], input[type='text']");
            if (!input) return;
            const show = input.type === "password";
            input.type = show ? "text" : "password";
            const icon = toggle.querySelector("i");
            if (icon) icon.className = show ? "ph ph-eye-slash" : "ph ph-eye";
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            const password = document.getElementById("reset-password").value;
            const confirm  = document.getElementById("reset-password-confirm").value;

            if (password !== confirm) {
                showMsg("Passwords do not match.", true);
                return;
            }
            if (password.length < 6) {
                showMsg("Password must be at least 6 characters.", true);
                return;
            }

            const btn = document.getElementById("reset-submit-btn");
            const original = btn.innerHTML;
            btn.innerHTML = '<span class="btn-text">Resetting...</span>';
            btn.disabled = true;

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token, new_password: password })
                });
                const result = await res.json();
                if (result.success) {
                    document.getElementById("reset-form-wrap").classList.add("hidden");
                    document.getElementById("reset-success-wrap").classList.remove("hidden");
                } else {
                    showMsg(result.error || "Failed to reset password.", true);
                    btn.innerHTML = original;
                    btn.disabled = false;
                }
            } catch (err) {
                showMsg("Network error. Please try again.", true);
                btn.innerHTML = original;
                btn.disabled = false;
            }
        });

        function showMsg(message, isError) {
            let el = form.querySelector(".form-feedback");
            if (!el) {
                el = document.createElement("p");
                el.className = "form-feedback";
                form.appendChild(el);
            }
            el.innerText = (isError ? "⚠ " : "✓ ") + message;
            el.style.cssText = (isError
                ? "color: var(--secondary); font-weight:600; text-align:center; margin-top:12px; animation: fadeIn 0.3s ease;"
                : "color: #10B981; font-weight:600; text-align:center; margin-top:12px; animation: fadeIn 0.3s ease;");
            if (isError) setTimeout(() => el.remove(), 5000);
        }
    </script>
</body>
</html>
